# ---------- Scraping ----------
location: "Germany"
country_indeed: "germany"

# JobSpy sites. indeed + linkedin are the most reliable for Germany.
# You can also try "glassdoor" and "google" (google uses google_search_term internally).
sites: ["indeed", "linkedin", "glassdoor"]

hours_old: 26              # a bit more than 24h so a late run doesn't miss anything
results_per_search: 40     # per search term per site
linkedin_fetch_description: true   # slower, but gives the LLM much better input
# Extra boards: arbeitnow, jooble (APIs; jooble needs JOOBLE_API_KEY); stepstone / xing / jobware / fraunhofer (research)
# are best-effort HTML scraping.
# jobvector.de is behind a Cloudflare challenge, dfki.de too (Cloudflare); are not supported.
extra_sites: ["arbeitnow", "jooble", "stepstone", "xing", "jobware", "fraunhofer"]
jooble_max_requests: 20   # the free Jooble key has 500 requests in total; this many per run (first terms)
html_board_max_jobs: 15    # postings fetched per term per HTML board
google: true              # Google Jobs via JobSpy (flaky; failures are skipped)
arbeitsagentur:            # Bundesagentur fuer Arbeit Jobsuche API
  enabled: true
  location: "Deutschland"
  days: 7                  # own posting window: few new postings per term per day
  size: 100                # results per search (API max 100)
  fetch_details: true      # extra request per job for the full description (skipped for known jobs)
  # Extra searches run only against the Arbeitsagentur, after the main terms. Its search works best
  # with broad German terms (7-day counts when added: "Werkstudent IT" 59, "Praktikum IT" 46).
  extra_searches:
    - "Werkstudent IT"
    - "Werkstudent Informatik"
    - "Werkstudent Wirtschaftsinformatik"
    - "Werkstudent Software"
    - "Werkstudent Anwendungsentwicklung"
    - "Werkstudent Datenanalyse"
    - "Werkstudent Digitalisierung"
    - "Werkstudent IT-Sicherheit"
    - "Werkstudent Webentwicklung"
    - "Werkstudent Data"
    - "Praktikum IT"
    - "Praktikum Informatik"
    - "Praktikum Wirtschaftsinformatik"
    - "Praktikum Data"
    - "Praktikum Digitalisierung"
    - "Praktikum Software"
    - "Abschlussarbeit Informatik"
    - "Abschlussarbeit IT"
    - "Masterarbeit Data"
    - "Studentische Hilfskraft Informatik"
sleep_between_searches: 6  # seconds; be gentle to avoid rate limits

# Startup career pages, read once per run from their applicant-tracking system's public feed.
# Only student-looking titles (Werkstudent, intern, thesis...) in Germany/remote are kept.
