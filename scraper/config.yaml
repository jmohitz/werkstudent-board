# Hard rules, checked on the TITLE before the LLM runs (case-insensitive regex). Matches are
# rejected without an LLM call, which also saves time. Keep patterns specific.
reject_title_patterns:
  - '\b(ausbildung|auszubildende[rn]?|azubi|schulpraktikum|schülerpraktikum|schuelerpraktikum|duales? studium)\b'
  - '\b(senior|lead|leiter(in)?|head of|principal|staff engineer|architect|architekt(in)?|director)\b'
  - '\b(mid[- ]?level|medior|experienced|erfahrene[rn]?)\b'

# Drop anything the LLM labels with these values
drop_categories: ["full_time", "other"]   # only Werkstudent / internship / thesis
drop_seniority: ["mid", "senior"]          # entry and junior only
drop_fields: ["other"]                      # non-technical roles (sales, HR, marketing...)

# Jobs posted more than this many days ago are deleted at the start of every run
# (jobs you track in the application tracker are kept)
expire_days: 7

# ---------- LLM ----------
# Gemini first (key in the repo's .env as GEMINI_API_KEY), models tried in order; Ollama is the
# fallback when every Gemini model is rate-limited, over quota or failing.
gemini:
  enabled: true
  # Tried best-first. Free-tier quotas are PER MODEL, so several models together give ~50 jobs/min.
  # Limits measured on this key (free tier): 3.8-flash 20/day, 3.5-flash 5/min,
  # 3.5-flash-lite 15/min, 3.1-flash-lite 15/min, gemma-4-26b no limit hit at 30/min (but flaky).
  models:
    - gemini-3.8-flash
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemma-4-26b-a4b-it
  # requests per minute per model, kept just under the quotas above. Raise if you enable billing.
  rpm:
    gemini-3.8-flash: 5
    gemini-3.5-flash: 4
    gemini-3.5-flash-lite: 14
    gemini-3.1-flash-lite: 14
    gemma-4-26b-a4b-it: 14
  max_workers: 8           # parallel requests
  spill_after_s: 2         # if a model's next free slot is further away, use the next model
  cooldown_s: 60           # skip a rate-limited / overloaded model this long
  timeout_s: 30
  max_description_chars: 4000

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5:3b"      # alternatives: qwen3:4b (slower, ~20 s/job), llama3.2:3b, qwen2.5:7b
  max_description_chars: 2000

# ---------- Output ----------
output_dir: "output"
