# The project file: dbt's entry point. It names the project, says which profile
# (database connection) to use, and sets defaults per folder.
name: werkstudent_board
version: "1.0.0"
profile: werkstudent_board   # looked up in profiles.yml

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

models:
  werkstudent_board:
    # Models build into their own schema so they never collide with the app's tables.
    # staging = light cleanup, one model per source table -> views (cheap, always fresh)
    staging:
      +materialized: view
      +schema: staging
    # intermediate = reshaping steps between staging and marts -> views
    intermediate:
      +materialized: view
      +schema: intermediate
    # marts = business questions -> tables (fast to query from the frontend)
    marts:
      +materialized: table
      +schema: marts
