services:
  db:
    image: postgres:16
    container_name: board-db
    restart: unless-stopped   # back up after a reboot/Docker restart, so the daily run finds it
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board
      POSTGRES_DB: board
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: